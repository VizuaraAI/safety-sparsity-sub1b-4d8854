# Default configuration for the safety-sparsity-sub1b study.
#
# Everything here is tuned so that a single run finishes on one consumer GPU
# (or slowly on CPU) with the smoke-test sizes. Scale `n_harmful`,
# `n_benign` and the model list up once the pipeline runs end to end.

run_name: baseline

model:
  # Start with the smallest model in the ladder. It downloads in seconds and
  # every bug you have will show up here first.
  name: HuggingFaceTB/SmolLM2-135M-Instruct
  base_name: HuggingFaceTB/SmolLM2-135M      # pre-instruct checkpoint, for base-vs-aligned contrasts
  dtype: float32                              # float32 on CPU, bfloat16 on GPU
  device: auto
  max_new_tokens: 48

# The full ladder. `scripts/run_ladder.sh` iterates over this list.
# Three points below 1B, three at or above, so the capacity line is bracketed.
ladder:
  - {name: HuggingFaceTB/SmolLM2-135M-Instruct, base_name: HuggingFaceTB/SmolLM2-135M,  params: 135000000}
  - {name: HuggingFaceTB/SmolLM2-360M-Instruct, base_name: HuggingFaceTB/SmolLM2-360M,  params: 360000000}
  - {name: Qwen/Qwen2.5-0.5B-Instruct,          base_name: Qwen/Qwen2.5-0.5B,           params: 494000000}
  - {name: Qwen/Qwen3-0.6B,                     base_name: Qwen/Qwen3-0.6B-Base,        params: 596000000}
  - {name: meta-llama/Llama-3.2-1B-Instruct,    base_name: meta-llama/Llama-3.2-1B,     params: 1236000000}
  - {name: Qwen/Qwen2.5-1.5B-Instruct,          base_name: Qwen/Qwen2.5-1.5B,           params: 1544000000}

data:
  # Public datasets, downloaded on first use and cached by `datasets`.
  # JailbreakBench is the default because it is ungated. HarmBench and
  # AdvBench are gated on the Hub: request access on the dataset page, export
  # HF_TOKEN, then switch harmful_dataset to walledai/HarmBench with
  # harmful_config: standard. Do that before the real run; the paper's
  # headline numbers should be on HarmBench.
  harmful_dataset: JailbreakBench/JBB-Behaviors
  harmful_config: behaviors
  harmful_split: harmful
  benign_dataset: natolambert/xstest-v2-copy
  capability_datasets: [allenai/ai2_arc, Rowan/hellaswag]
  n_harmful: 40          # raise to 200 for the real run
  n_benign: 40           # raise to 250 for the real run
  n_capability: 200      # raise to the full split for the real run
  seed: 17

# Axis A: token-depth sparsity. We prefill the assistant turn with the first k
# tokens of a compliant response and sweep k.
token_axis:
  prefill_depths: [0, 1, 2, 4, 8, 16, 32]
  asr_threshold: 0.5     # k* is the smallest depth whose ASR exceeds this

# Axis B: neuron-support sparsity. Safety neurons are scored by contrasting
# MLP post-activations on harmful vs benign prompts.
neuron_axis:
  fractions: [0.0001, 0.0005, 0.001, 0.005, 0.01, 0.05, 0.10, 0.25]
  refusal_drop_target: 0.9   # p* is the smallest fraction hitting this drop
  entanglement_top_m: 2048   # |S| = |C| when computing the SCE Jaccard overlap

# Axis C: subspace-rank sparsity. Difference-in-means directions, ablated
# cumulatively from the whole residual stream.
direction_axis:
  max_rank: 16
  refusal_floor: 0.1     # r* is the smallest rank driving refusal below this
  layer_fractions: [0.4, 0.5, 0.6, 0.7, 0.8]   # where to read the residual stream

# The intervention test: three ways of buying safety, compared on the same axes.
intervention:
  method: localized      # one of: full_sft | lora | localized
  epochs: 1
  batch_size: 4
  grad_accum: 4
  learning_rate: 1.0e-5
  lora_r: 16
  lora_alpha: 32
  max_seq_len: 512
  train_examples: 512

output:
  dir: runs
  save_activations: false   # these get large fast; turn on only when debugging
